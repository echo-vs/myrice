# Сгенерировано rice.py (меню Super + I). Правки руками перезапишутся.
general {
    gaps_in  = 10
    gaps_out = 24
    border_size = 3
    col.active_border   = $tea $amber 45deg
    col.inactive_border = $overlay
}

decoration {
    rounding = 16
    inactive_opacity = 0.9

    blur {
        enabled = true
        size = 6
        passes = 2
    }

    shadow {
        enabled = true
        color = rgba(1f1621b0)
        color_inactive = rgba(1f162160)
    }
}

animations {
    enabled = true
}

# Клавиатура и мышь
input {
    kb_layout  = us,ru
    kb_options = grp:alt_shift_toggle
    repeat_rate  = 40
    repeat_delay = 280
    sensitivity  = 0.00
    accel_profile = adaptive
    natural_scroll = false
    follow_mouse = 1
}

# Язык интерфейса
env = LANG,en_US.UTF-8
env = LANGUAGE,en_US:en

# Окна настроек
windowrule {
    name = rice-settings
    match:class = ^(rice\.settings)$
    float = on
    size = 1040 720
    center = on
}
windowrule {
    name = rice-popups
    match:class = ^(rice\.(themes|lang))$
    float = on
    center = on
}

# Терминал без размытия
windowrule {
    name = rice-term-noblur
    match:class = ^(kitty)$
    no_blur = on
}

# Размытие под панелью
layerrule {
    name = rice-bar-blur
    match:namespace = ^(waybar)$
    blur = on
    ignore_alpha = 0.1
}
