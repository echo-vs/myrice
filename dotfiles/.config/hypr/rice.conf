# Сгенерировано rice.py (меню Super + I). Правки руками перезапишутся.
general {
    gaps_in  = 6
    gaps_out = 14
    border_size = 2
    col.active_border   = $tea $amber 45deg
    col.inactive_border = $overlay
}

decoration {
    rounding = 10
    inactive_opacity = 0.97

    blur {
        enabled = true
    }

    shadow {
        enabled = true
        color = rgba(1d2021b0)
        color_inactive = rgba(1d202160)
    }
}

animations {
    enabled = true
}

# Клавиатура и мышь
input {
    kb_layout  = us,ru
    kb_options = grp:alt_shift_toggle
    repeat_rate  = 40
    repeat_delay = 280
    sensitivity  = 0.00
    accel_profile = adaptive
    natural_scroll = false
    follow_mouse = 1
}

# Язык интерфейса
env = LANG,en_US.UTF-8
env = LANGUAGE,en_US:en

# Окна настроек
windowrule {
    name = rice-settings
    match:class = ^(rice\.settings)$
    float = on
    size = 1040 720
    center = on
}
windowrule {
    name = rice-popups
    match:class = ^(rice\.(themes|lang))$
    float = on
    center = on
}
