# hyprEcho · экран блокировки
source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.1
}

# Время
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $paper
    font_size = 110
    font_family = Iosevka Bold
    position = 0, 170
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date +"%A, %-d %B"
    color = $muted
    font_size = 20
    font_family = Iosevka
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 12
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $tea $amber 45deg
    inner_color = rgba(2b1f2ee0)
    font_color = $fg
    check_color = $sage
    fail_color = $clay
    fail_text = <i>не то, попробуй ещё</i>
    placeholder_text = <span foreground="##a68aa8">пароль…</span>
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = 茶  $USER
    color = $muted
    font_size = 13
    font_family = Iosevka
    position = 0, 40
    halign = center
    valign = bottom
}
