# ─────────────────────────────────────────────
#  hyprEcho · Hyprland
#  Шпаргалка по хоткеям: Super + /
# ─────────────────────────────────────────────

source = ~/.config/hypr/colors.conf

# ── Монитор ──────────────────────────────────
monitor = DP-1, 2560x1440@240, 0x0, 1
monitor = , preferred, auto, 1

# ── Программы ────────────────────────────────
$mod      = SUPER
$term     = kitty
$files    = dolphin
$browser  = firefox-bin
$menu     = rofi -show drun
$scripts  = ~/.config/hypr/scripts

# ── Окружение (NVIDIA + Wayland) ─────────────
# env = LIBVA_DRIVER_NAME,nvidia  # не NVIDIA
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia  # не NVIDIA
# env = NVD_BACKEND,direct  # не NVIDIA
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,kde
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XCURSOR_THEME,Nordic-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ── Автозапуск ───────────────────────────────
exec-once = dbus-update-activation-environment --all
# exec-once = gentoo-pipewire-launcher  # pipewire запускает systemd restart
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = $scripts/wallpaper.sh restore
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark
exec-once = gsettings set org.gnome.desktop.interface icon-theme Papirus-Dark
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Nordic-cursors
exec-once = gsettings set org.gnome.desktop.interface font-name "Noto Sans 11"
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name "Iosevka 12"
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── Ввод ─────────────────────────────────────
input {
    kb_layout  = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity  = 0
    repeat_rate  = 40
    repeat_delay = 280
}

# ── Внешний вид ──────────────────────────────
general {
    gaps_in  = 6
    gaps_out = 14
    border_size = 2
    col.active_border   = $tea $amber 45deg
    col.inactive_border = $overlay
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    active_opacity   = 1.0
    inactive_opacity = 0.97

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(0d0c0cb0)
        color_inactive = rgba(0d0c0c60)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.12
        noise = 0.015
        new_optimizations = true
    }
}

# Быстрые и мягкие: не «желе», но и не резко
animations {
    enabled = true
    bezier = tea,  0.16, 1.0, 0.3, 1.0
    bezier = soft, 0.4, 0.0, 0.2, 1.0

    animation = windows,     1, 3, tea,  popin 92%
    animation = windowsOut,  1, 2, soft, popin 92%
    animation = windowsMove, 1, 3, tea
    animation = border,      1, 4, soft
    animation = fade,        1, 2, soft
    animation = layers,      1, 2, tea, fade
    animation = workspaces,  1, 3, tea, slidefade 12%
    animation = specialWorkspace, 1, 3, tea, slidefadevert 15%
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $bg
    focus_on_activate = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ── Хоткеи ───────────────────────────────────
# bindd = модификаторы, клавиша, описание (для шпаргалки), действие

# Приложения
bindd  = $mod, Return, Терминал, exec, $term
bindd  = $mod, Space, Лаунчер, exec, $menu
bindrd = $mod, SUPER_L, Лаунчер (просто нажать Super), exec, pkill rofi || $menu
bindd  = $mod, E, Файлы, exec, $files
bindd  = $mod, B, Браузер, exec, $browser
bindd  = $mod, V, История буфера обмена, exec, $scripts/clipboard.sh
bindd  = $mod, slash, Эта шпаргалка, exec, $scripts/keybinds.sh
bindd  = $mod SHIFT, C, Пипетка цвета, exec, hyprpicker -a
bindd  = $mod, W, Сменить обои, exec, $scripts/wallpaper.sh
bindd  = $mod, I, Настройки (окно), exec, ~/.config/hypr/rice/gui.py
bindd  = $mod SHIFT, I, Настройки (быстрое меню), exec, ~/.config/hypr/rice/rice.py menu
bindd  = $mod, T, Темы, exec, ~/.config/hypr/rice/gui.py themes
bindd  = $mod SHIFT, Space, Язык и раскладка, exec, ~/.config/hypr/rice/gui.py lang

# Окна
bindd = $mod, Q, Закрыть окно, killactive
bindd = $mod, F, Полный экран, fullscreen, 0
bindd = $mod, M, Развернуть (с баром), fullscreen, 1
bindd = $mod SHIFT, F, Плавающее окно, togglefloating
bindd = $mod, P, Псевдотайлинг, pseudo
bindd = $mod, C, Центрировать окно, centerwindow

# Фокус: Super + hjkl / стрелки
bindd = $mod, H, Фокус влево,  movefocus, l
bindd = $mod, L, Фокус вправо, movefocus, r
bindd = $mod, K, Фокус вверх,  movefocus, u
bindd = $mod, J, Фокус вниз,   movefocus, d
bind  = $mod, left,  movefocus, l
bind  = $mod, right, movefocus, r
bind  = $mod, up,    movefocus, u
bind  = $mod, down,  movefocus, d

# Перемещение: Super + Shift + hjkl
bindd = $mod SHIFT, H, Сдвинуть окно влево,  movewindow, l
bindd = $mod SHIFT, L, Сдвинуть окно вправо, movewindow, r
bindd = $mod SHIFT, K, Сдвинуть окно вверх,  movewindow, u
bindd = $mod SHIFT, J, Сдвинуть окно вниз,   movewindow, d

# Размер: Super + Ctrl + hjkl (зажимать)
binded = $mod CTRL, H, Уже,   resizeactive, -40 0
binded = $mod CTRL, L, Шире,  resizeactive, 40 0
binded = $mod CTRL, K, Ниже,  resizeactive, 0 -40
binded = $mod CTRL, J, Выше,  resizeactive, 0 40

# Мышь: Super + ЛКМ двигать, Super + ПКМ ресайз
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Рабочие столы
bindd = $mod, 1, Стол 1, workspace, 1
bind  = $mod, 2, workspace, 2
bind  = $mod, 3, workspace, 3
bind  = $mod, 4, workspace, 4
bind  = $mod, 5, workspace, 5
bind  = $mod, 6, workspace, 6
bind  = $mod, 7, workspace, 7
bind  = $mod, 8, workspace, 8
bind  = $mod, 9, workspace, 9
bind  = $mod, 0, workspace, 10
bindd = $mod SHIFT, 1, Окно на стол 1 (аналогично 2–0), movetoworkspace, 1
bind  = $mod SHIFT, 2, movetoworkspace, 2
bind  = $mod SHIFT, 3, movetoworkspace, 3
bind  = $mod SHIFT, 4, movetoworkspace, 4
bind  = $mod SHIFT, 5, movetoworkspace, 5
bind  = $mod SHIFT, 6, movetoworkspace, 6
bind  = $mod SHIFT, 7, movetoworkspace, 7
bind  = $mod SHIFT, 8, movetoworkspace, 8
bind  = $mod SHIFT, 9, movetoworkspace, 9
bind  = $mod SHIFT, 0, movetoworkspace, 10
bindd = $mod, Tab, Предыдущий стол, workspace, previous
bindd = $mod, mouse_down, Следующий стол (колесо), workspace, e+1
bind  = $mod, mouse_up, workspace, e-1

# Скретчпад: спрятанный стол «под рукой»
bindd = $mod, S, Показать/скрыть скретчпад, togglespecialworkspace, scratch
bindd = $mod SHIFT, S, Окно в скретчпад, movetoworkspace, special:scratch

# Скриншоты
bindd = , Print, Скриншот области → буфер, exec, $scripts/screenshot.sh area
bindd = SHIFT, Print, Скриншот экрана → буфер, exec, $scripts/screenshot.sh screen
bindd = CTRL, Print, Скриншот области → редактор, exec, $scripts/screenshot.sh edit

# Система
bindd = $mod, Escape, Заблокировать экран, exec, loginctl lock-session
bindd = $mod SHIFT, E, Меню питания, exec, $scripts/powermenu.sh
bindd = $mod, N, Не беспокоить вкл/выкл, exec, $scripts/dnd.sh toggle
bindd = $mod SHIFT, R, Перезагрузить конфиг, exec, hyprctl reload

# Медиаклавиши
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous

# Настройки из меню Super + I (генерирует rice.py). Идёт последним, чтобы перекрывать.
source = ~/.config/hypr/rice.conf
